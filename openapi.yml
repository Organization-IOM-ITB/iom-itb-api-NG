openapi: 3.0.3
info:
  title: IOM ITB API
  version: 1.0.0
  description: |
    OpenAPI specification for IOM ITB backend API.

    Authentication:
    - Most admin endpoints require `Authorization: Bearer <JWT>`.
    - `/auth/register` requires `x-api-key`.
    - Tally webhook endpoints are intended to be called by Tally webhook integration.
    - Midtrans notification endpoint is intended to be called by Midtrans and may be IP allowlisted.

# Server dikosongkan untuk mematikan fungsi testing (Try it out) agar dokumentasi hanya bersifat bacaan
servers: []

tags:
  - name: Health
  - name: Auth
  - name: Dashboard
  - name: Activities
  - name: Merchandise
  - name: Transactions
  - name: Donations
  - name: Legacy Donasi Sheet
  - name: Faculties
  - name: Dana Bantuan
  - name: Tally Submissions
  - name: Tally Webhooks
  - name: Kemitraan
  - name: Kegiatan Kemitraan
  - name: Files
  - name: Payments
  - name: Members
  - name: Users
  - name: Admins
  - name: Help Submissions
  - name: Competition
  - name: Bankes Mock
  - name: Broadcast

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [Health]
      summary: Get API version
      security: []
      responses:
        '200':
          description: API version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 3.9.0

  /auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user profile
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/apps:
    get:
      tags: [Auth]
      summary: Get accessible applications for authenticated user
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/select:
    post:
      tags: [Auth]
      summary: Select active app and role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectAppRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/register:
    post:
      tags: [Auth]
      summary: Register user through SSO admin flow
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard KPI statistics
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /dashboard/charts:
    get:
      tags: [Dashboard]
      summary: Get dashboard chart data
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /dashboard/recent:
    get:
      tags: [Dashboard]
      summary: Get recent submissions and admin activities
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /dashboard/payments:
    get:
      tags: [Dashboard]
      summary: Get payment monitoring dashboard data
      parameters:
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
        - $ref: '#/components/parameters/DonationTypeQuery'
        - $ref: '#/components/parameters/PaymentStatusQuery'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /activities:
    get:
      tags: [Activities]
      summary: List activities
      security: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActivityStatus'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Activities]
      summary: Create activity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /activities/counts:
    get:
      tags: [Activities]
      summary: Get activity counts by status
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /activities/id/{id}:
    get:
      tags: [Activities]
      summary: Get activity by numeric id
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /activities/{slug}:
    get:
      tags: [Activities]
      summary: Get activity by slug or route parameter
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /activities/{id}:
    put:
      tags: [Activities]
      summary: Update activity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Activities]
      summary: Delete activity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /merchandises:
    get:
      tags: [Merchandise]
      summary: List merchandise
      security: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Merchandise]
      summary: Create merchandise
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchandiseInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /merchandises/categories:
    post:
      tags: [Merchandise]
      summary: Create merchandise category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  
  /merchandises/categories/{categoryId}:
    put:
      tags: [Merchandise]
      summary: Update merchandise category
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Merchandise]
      summary: Delete merchandise category
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /merchandises/{id}:
    get:
      tags: [Merchandise]
      summary: Get merchandise by id
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Merchandise]
      summary: Update merchandise
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchandiseInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Merchandise]
      summary: Delete merchandise
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transactions:
    get:
      tags: [Transactions]
      summary: List merchandise transactions
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Transactions]
      summary: Create merchandise transaction
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /transactions/public/{token}:
    get:
      tags: [Transactions]
      summary: Get transaction by public token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get transaction by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Transactions]
      summary: Update transaction
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Transactions]
      summary: Delete transaction
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /donations:
    get:
      tags: [Donations]
      summary: Public list donations
      security: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Donations]
      summary: Create donation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DonationInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /donations/admin:
    get:
      tags: [Donations]
      summary: Admin list donations with payment filters
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PaymentMethodQuery'
        - $ref: '#/components/parameters/PaymentStatusQuery'
        - $ref: '#/components/parameters/DonationTypeQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /donations/{id}:
    get:
      tags: [Donations]
      summary: Get donation by id
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Donations]
      summary: Update donation
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DonationInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Donations]
      summary: Delete donation
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /payments/snap-token:
    post:
      tags: [Payments]
      summary: Create Midtrans Snap token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapTokenRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /payments/notification:
    post:
      tags: [Payments]
      summary: Receive Midtrans payment notification webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify payment status
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOrderRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /payments/cancel:
    post:
      tags: [Payments]
      summary: Cancel payment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOrderRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /faculties:
    get:
      tags: [Faculties]
      summary: List faculties
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Faculties]
      summary: Create faculty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /faculties/{id}:
    put:
      tags: [Faculties]
      summary: Update faculty
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Faculties]
      summary: Delete faculty
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tally-submissions/form/{formSlug}:
    get:
      tags: [Tally Submissions]
      summary: List Tally submissions by form slug
      parameters:
        - $ref: '#/components/parameters/FormSlugPath'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /tally-submissions/form/{formSlug}/{tallySubmissionId}:
    get:
      tags: [Tally Submissions]
      summary: Get Tally submission detail
      parameters:
        - $ref: '#/components/parameters/FormSlugPath'
        - name: tallySubmissionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tally-submissions/form/{formSlug}/{tallySubmissionId}/whatsapp:
    post:
      tags: [Tally Submissions]
      summary: Send WhatsApp notification for Tally submission
      parameters:
        - $ref: '#/components/parameters/FormSlugPath'
        - name: tallySubmissionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /tally-submissions/pengajuan-bantuan/{tallySubmissionId}/status:
    patch:
      tags: [Tally Submissions]
      summary: Update pengajuan bantuan status
      parameters:
        - name: tallySubmissionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePengajuanBantuanStatusRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /webhooks/tally/pendaftaran-anggota:
    post:
      tags: [Tally Webhooks]
      summary: Receive Tally webhook for pendaftaran anggota
      security: []
      requestBody:
        $ref: '#/components/requestBodies/TallyWebhook'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /webhooks/tally/pengajuan-bantuan:
    post:
      tags: [Tally Webhooks]
      summary: Receive Tally webhook for pengajuan bantuan
      security: []
      requestBody:
        $ref: '#/components/requestBodies/TallyWebhook'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /webhooks/tally/orang-tua-asuh:
    post:
      tags: [Tally Webhooks]
      summary: Receive Tally webhook for orang tua asuh
      security: []
      requestBody:
        $ref: '#/components/requestBodies/TallyWebhook'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /dana-bantuan:
    get:
      tags: [Dana Bantuan]
      summary: List dana bantuan
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Dana Bantuan]
      summary: Create dana bantuan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DanaBantuanInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /dana-bantuan/{id}:
    get:
      tags: [Dana Bantuan]
      summary: Get dana bantuan by id
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Dana Bantuan]
      summary: Update dana bantuan
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DanaBantuanInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Dana Bantuan]
      summary: Delete dana bantuan
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /kemitraan:
    get:
      tags: [Kemitraan]
      summary: List kemitraan
      security: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Kemitraan]
      summary: Create kemitraan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KemitraanInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /kemitraan/{id}:
    get:
      tags: [Kemitraan]
      summary: Get kemitraan by id
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Kemitraan]
      summary: Update kemitraan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KemitraanInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Kemitraan]
      summary: Delete kemitraan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /kegiatan-kemitraan:
    get:
      tags: [Kegiatan Kemitraan]
      summary: List kegiatan kemitraan
      security: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LengthQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Kegiatan Kemitraan]
      summary: Create kegiatan kemitraan
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KegiatanKemitraanInput'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /kegiatan-kemitraan/{id}:
    put:
      tags: [Kegiatan Kemitraan]
      summary: Update kegiatan kemitraan
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KegiatanKemitraanInput'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Kegiatan Kemitraan]
      summary: Delete kegiatan kemitraan
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /file/upload:
    post:
      tags: [Files]
      summary: Upload generic file
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /file/download:
    get:
      tags: [Files]
      summary: Download uploaded file
      security: []
      parameters:
        - name: filename
          in: query
          schema: { type: string }
      responses:
        '200':
          description: File stream
  /file/preview:
    get:
      tags: [Files]
      summary: Preview uploaded file
      security: []
      parameters:
        - name: filename
          in: query
          schema: { type: string }
      responses:
        '200':
