components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LengthQuery:
      name: length
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
    SearchQuery:
      name: search
      in: query
      schema: { type: string }
    StartDateQuery:
      name: startDate
      in: query
      schema:
        type: string
        format: date
    EndDateQuery:
      name: endDate
      in: query
      schema:
        type: string
        format: date
    PaymentMethodQuery:
      name: paymentMethod
      in: query
      schema:
        $ref: '#/components/schemas/PaymentMethod'
    PaymentStatusQuery:
      name: paymentStatus
      in: query
      schema:
        $ref: '#/components/schemas/PaymentStatus'
    DonationTypeQuery:
      name: donationType
      in: query
      schema:
        $ref: '#/components/schemas/DonationType'
    FormSlugPath:
      name: formSlug
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TallyFormSlug'

  requestBodies:
    TallyWebhook:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Created:
      description: Created response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Paginated:
      description: Paginated response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: array
          items: {}
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        length:
          type: integer
          example: 10
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Error message

    SelectAppRequest:
      type: object
      required: [appId, role]
      properties:
        appId:
          type: string
          example: web
        role:
          type: string
          example: admin
    RegisterUserRequest:
      type: object
      required: [email, name]
      additionalProperties: true
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items: { type: string }

    ActivityStatus:
      type: string
      enum: [draft, published]
    ActivityMediaInput:
      type: object
      properties:
        type:
          type: string
          enum: [image, youtube]
        value:
          type: string
        caption:
          type: string
        order:
          type: integer
    ActivityInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        image:
          type: string
        url:
          type: string
        status:
          $ref: '#/components/schemas/ActivityStatus'
        media:
          type: array
          items:
            $ref: '#/components/schemas/ActivityMediaInput'

    MerchandiseInput:
      type: object
      required: [name, price, stock]
      properties:
        image:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        stock:
          type: integer
        link:
          type: string

    TransactionStatus:
      type: string
      enum: [waiting, on process, on delivery, arrived, done, canceled, denied]
    TransactionInput:
      type: object
      required: [username, email, noTelp, address, merchandiseId, qty]
      properties:
        code:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        noTelp:
          type: string
        address:
          type: string
        merchandiseId:
          type: integer
        qty:
          type: integer
        status:
          $ref: '#/components/schemas/TransactionStatus'
        payment:
          type: string
          format: binary
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'

    DonationType:
      type: string
      enum:
        - iuran_sukarela
        - kontribusi_anggota
        - kontribusi_donatur
        - pembelian_merchandise
        - kontribusi_sukarela
    PaymentMethod:
      type: string
      enum: [manual, midtrans]
    PaymentStatus:
      type: string
      enum: [pending, settlement, expired, failed, refunded]
    DonationInput:
      type: object
      required: [name, email, noWhatsapp, notification]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        noWhatsapp:
          type: string
        proof:
          type: string
          format: binary
        notification:
          type: array
          items:
            type: string
            enum: [whatsapp, email]
        amount:
          type: number
        options:
          type: object
          additionalProperties: true
        date:
          type: string
          format: date
        bank:
          type: string
        donationType:
          $ref: '#/components/schemas/DonationType'
        facultyId:
          type: integer
        hideName:
          type: boolean
        hambaAllah:
          type: boolean
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'

    FacultyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Fakultas Teknologi Industri
        kodeUnik:
          type: string
          maxLength: 3
          example: '001'
        isActive:
          type: boolean
          default: true

    TallyFormSlug:
      type: string
      enum: [pendaftaran_anggota, pengajuan_bantuan, orang_tua_asuh]
    PengajuanBantuanStatus:
      type: string
      enum:
        - TIDAK_DIKETAHUI
        - VERIFIKASI_BERKAS
        - DIPANGGIL_WAWANCARA
        - KEPUTUSAN_DITERIMA
        - KEPUTUSAN_DITOLAK
    UpdatePengajuanBantuanStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/PengajuanBantuanStatus'
        catatan:
          type: string
          nullable: true

    DanaBantuanInput:
      type: object
      required: [id_penerima, jenis_bantuan, bulan, tahun, jumlah_donasi]
      properties:
        id_penerima:
          type: integer
        jenis_bantuan:
          type: string
          enum:
            - Biaya UKT
            - Biaya Hidup
            - Biaya Tugas Akhir
            - Biaya Kesehatan (Bagi yang membutuhkan dan bersifat darurat)
            - Bantuan Orang Tua Asuh
            - Bantuan Lainnya
        bulan:
          type: string
          enum: [Januari, Febuari, Maret, April, Mei, Juni, Juli, Agustus, September, Oktober, November, Desember]
        tahun:
          type: integer
        jumlah_donasi:
          type: number
          format: decimal

    KemitraanInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        picName:
          type: string
        picPhone:
          type: string
        image:
          type: string
          format: binary
        mou:
          type: string
          format: binary
    KegiatanKemitraanStatus:
      type: string
      enum: [planned, ongoing, completed, cancelled]
    KegiatanKemitraanInput:
      type: object
      required: [kemitraanId, name]
      properties:
        kemitraanId:
          type: integer
        name:
          type: string
        description:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/KegiatanKemitraanStatus'
        image:
